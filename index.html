<style>
:root {
  --bg: #f8fafc;
  --panel: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --blue: #2563eb;
  --green: #16a34a;
  --red: #dc2626;
  --orange: #ea580c;
  --purple: #7c3aed;
  --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, textarea, select { font: inherit; }
button {
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 700;
}
button.secondary { background: #e2e8f0; color: var(--ink); }
button.danger { background: var(--red); }
button:disabled { opacity: .45; cursor: not-allowed; }
.app { max-width: 1440px; margin: 0 auto; padding: 28px; }
.hero {
  display: grid;
  gap: 16px;
  grid-template-columns: 1.5fr .9fr;
  align-items: stretch;
  margin-bottom: 18px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 18px;
}
.hero h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.03em; }
.muted { color: var(--muted); }
.alert {
  border: 1px solid #fecaca;
  background: #fff1f2;
  color: #991b1b;
  border-radius: 14px;
  padding: 12px;
  margin-top: 12px;
}
.grid { display: grid; gap: 16px; }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.metric strong { font-size: 28px; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 4px 9px;
  background: #eef2ff;
  color: #3730a3;
  font-size: 12px;
  font-weight: 800;
}
.badge.green { background: #dcfce7; color: #166534; }
.badge.red { background: #fee2e2; color: #991b1b; }
.badge.orange { background: #ffedd5; color: #9a3412; }
.badge.gray { background: #f1f5f9; color: #475569; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.table-wrap { width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: #f8fafc; color: #475569; font-size: 12px; }
.section-title { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }
.qr-box {
  min-height: 180px;
  display: grid;
  place-items: center;
  border: 1px dashed #93c5fd;
  border-radius: 16px;
  background: #eff6ff;
  overflow: hidden;
}
.qr-box svg { max-width: 170px; width: 100%; height: auto; }
.qr-box img { max-width: 170px; width: 100%; height: auto; }
.form-row { display: grid; gap: 8px; margin: 10px 0; }
.form-row input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
.check-list { display: grid; gap: 8px; }
.check-item {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  padding: 8px 0;
}
.log {
  background: #0f172a;
  color: #dbeafe;
  border-radius: 14px;
  padding: 12px;
  max-height: 220px;
  overflow: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
}
@media (max-width: 1024px) {
  .hero, .grid.cols-4, .grid.cols-3 { grid-template-columns: 1fr; }
  .app { padding: 16px; }

if (typeof window === 'undefined') return;\n  try {\n    const hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));\n    if (url) hashParams.set('formUrl', url);\n    else hashParams.delete('formUrl');\n    const nextHash = hashParams.toString();\n    window.location.hash = nextHash ? `#${nextHash}` : '';\n  } catch (err) {\n    console.warn('[Storage] hash URL 저장 불가:', err.message);\n  }\n}\n\nfunction replaceTemplateVars(template, vars) {\n  return Object.entries(vars).reduce((acc, [key, value]) => acc.replaceAll(key, value || ''), template || '');\n}\n\nasync function sendKakaoMessage(item, env) {\n  const baseUrl = env.KAKAO_CHANNEL_API_BASE_URL || 'https://kapi.kakao.com';\n  const token = env.KAKAO_CHANNEL_ACCESS_TOKEN || '';\n  if (!token || token.includes('REPLACE_WITH')) {\n    throw new Error('Kakao token is missing. 내부 MVP용 .env 설정 DB에서 토큰을 확인하세요.');\n  }\n  const res = await fetch(`${baseUrl}/v1/api/talk/channel/message/send`, {\n    method: 'POST',\n    headers: {\n      Authorization: `Bearer ${token}`,\n      'Content-Type': 'application/json'\n    },\n    body: JSON.stringify({\n      receiver_id: item.kakaoId || item.recipient,\n      message_type: item.messageType || 'text',\n      text: item.body,\n      link: item.link || undefined\n    })\n  });\n  if (!res.ok) throw new Error(`Kakao API failed: ${res.status}`);\n  return res.json();\n}\n\nfunction App() {\n  const [formUrl, setFormUrl] = useState(() => getStoredFormUrl());\n  const [surveys, setSurveys] = useState(MOCK_SURVEYS);\n  const [sessions, setSessions] = useState(MOCK_SESSIONS);\n  const [knowledge, setKnowledge] = useState(MOCK_KNOWLEDGE);\n  const [queue, setQueue] = useState(MOCK_QUEUE);\n  const [env, setEnv] = useState({});\n  const [envFormUrlPageId, setEnvFormUrlPageId] = useState('');\n  const [savingFormUrl, setSavingFormUrl] = useState(false);\n  const [logs, setLogs] = useState(['앱 시작: mock fallback 준비 완료']);\n  const [loading, setLoading] = useState(false);\n  const [polling, setPolling] = useState(false);\n  const timerRef = useRef(null);\n\n  const [qrSvg, setQrSvg] = useState('');\n  const [qrDataUrl, setQrDataUrl] = useState('');\n  const queueStats = useMemo(() => {\n    const active = queue.filter((item) => ['발송대기', '예약됨', '예약초과', '실패', '재시도대기'].includes(item.status));\n    const failed = queue.filter((item) => ['실패', '재시도대기', '예약초과'].includes(item.status));\n    return { active: active.length, failed: failed.length };\n  }, [queue]);\n\n  function addLog(message) {\n    setLogs((prev) => [`${new Date().toLocaleTimeString('ko-KR')} ${message}`, ...prev].slice(0, 80));\n  }\n\n  function applyEnvData(envData) {\n    const parsedEnv = {};\n    let formUrlPageId = '';\n    (envData.results || []).forEach((page) => {\n      const key = getPlain(page.properties.Key);\n      const value = getPlain(page.properties.Value);\n      if (key) parsedEnv[key] = value;\n      if (key === 'FIRST_VISIT_FORM_URL') formUrlPageId = page.id;\n    });\n    setEnv(parsedEnv);\n    setEnvFormUrlPageId(formUrlPageId);\n    if (Object.prototype.hasOwnProperty.call(parsedEnv, 'FIRST_VISIT_FORM_URL')) {\n      const nextUrl = parsedEnv.FIRST_VISIT_FORM_URL || '';\n      setFormUrl(nextUrl);\n      setStoredFormUrl(nextUrl);\n      addLog('FIRST_VISIT_FORM_URL 로드 완료');\n    } else {\n      addLog('FIRST_VISIT_FORM_URL 행을 찾지 못했습니다.');\n    }\n    return { parsedEnv, formUrlPageId };\n  }\n\n  async function loadEnvSettings() {\n    const envData = await queryDatabase(DB.env);\n    return applyEnvData(envData);\n  }\n\n  async function saveEnvFormUrl(nextUrl) {\n    if (!envFormUrlPageId) {\n      addLog('FIRST_VISIT_FORM_URL 저장 대기: .env 설정 DB를 먼저 불러와야 합니다.');\n      return;\n    }\n    setSavingFormUrl(true);\n    try {\n      await patchPage(envFormUrlPageId, {\n        Value: { rich_text: [{ text: { content: nextUrl } }] },\n        '사용 여부': { checkbox: Boolean(nextUrl) }\n      });\n      setEnv((prev) => ({ ...prev, FIRST_VISIT_FORM_URL: nextUrl }));\n      addLog('FIRST_VISIT_FORM_URL 저장 완료');\n    } catch (err) {\n      console.warn('[Env] FIRST_VISIT_FORM_URL 저장 실패:', err.message);\n      addLog(`FIRST_VISIT_FORM_URL 저장 실패: ${err.message}`);\n    } finally {\n      setSavingFormUrl(false);\n    }\n  }\n\n  function handleChangeFormUrl(event) {\n    const nextUrl = event.target.value;\n    setFormUrl(nextUrl);\n    setStoredFormUrl(nextUrl);\n  }\n\n  useEffect(() => {\n    let alive = true;\n    generateQrAssets(formUrl)\n      .then((assets) => {\n        if (!alive) return;\n        setQrSvg(assets.svg);\n        setQrDataUrl(assets.png);\n      })\n      .catch((err) => {\n        console.warn('[QR] 생성 실패:', err.message);\n        if (!alive) return;\n        setQrSvg('');\n        setQrDataUrl('');\n      });\n    return () => {\n      alive = false;\n    };\n  }, [formUrl]);\n\n  useEffect(() => {\n    if (!envFormUrlPageId) return;\n    if (formUrl === (env.FIRST_VISIT_FORM_URL || '')) return;\n    const timer = window.setTimeout(() => {\n      saveEnvFormUrl(formUrl);\n    }, 700);\n    return () => window.clearTimeout(timer);\n  }, [formUrl, envFormUrlPageId, env.FIRST_VISIT_FORM_URL]);\n\n  async function loadAll() {\n    setLoading(true);\n    try {\n      let parsedEnv = {};\n      try {\n        const envResult = await loadEnvSettings();\n        parsedEnv = envResult.parsedEnv;\n      } catch (envErr) {\n        console.warn('[MVP] .env 설정 DB 로드 실패:', envErr.message);\n        addLog(`.env 설정 DB 로드 실패: ${envErr.message}`);\n      }\n\n      const [surveyResult, sessionResult, kbResult, queueResult] = await Promise.allSettled([\n        queryDatabase(DB.survey),\n        queryDatabase(DB.sessions),\n        queryDatabase(DB.knowledge),\n        queryDatabase(DB.queue)\n      ]);\n\n      const surveyData = surveyResult.status === 'fulfilled' ? surveyResult.value : { results: [] };\n      const sessionData = sessionResult.status === 'fulfilled' ? sessionResult.value : { results: [] };\n      const kbData = kbResult.status === 'fulfilled' ? kbResult.value : { results: [] };\n      const queueData = queueResult.status === 'fulfilled' ? queueResult.value : { results: [] };\n\n      const parsedSurveys = (surveyData.results || []).map((page) => ({\n        id: page.id,\n        title: getPlain(page.properties['이름']),\n        name: getPlain(page.properties['이름']),\n        symptom: getPlain(page.properties['주소증']),\n        status: getPlain(page.properties['설문 처리 상태']),\n        redFlags: getPlain(page.properties['위험 신호']),\n        consent: getPlain(page.properties['개인정보 수집 동의'])\n      }));\n      const parsedSessions = (sessionData.results || []).map((page) => ({\n        id: page.id,\n        title: getPlain(page.properties['세션명']),\n        patientCode: getPlain(page.properties['환자 코드 또는 EMR 참조 ID']),\n        stage: getPlain(page.properties['진료 단계 상태']),\n        symptoms: getPlain(page.properties['주요 증상 키워드']),\n        approval: getPlain(page.properties['발송 승인 상태'])\n      }));\n      const parsedKb = (kbData.results || []).map((page) => ({\n        id: page.id,\n        title: getPlain(page.properties['자료명']),\n        type: getPlain(page.properties['자료 유형']),\n        summary: getPlain(page.properties['핵심 요약']),\n        caution: getPlain(page.properties['주의/금기'])\n      }));\n      const parsedQueue = (queueData.results || []).map((page) => ({\n        id: page.id,\n        title: getPlain(page.properties['요청명']),\n        source: getPlain(page.properties['발송 출처']),\n        recipient: getPlain(page.properties['수신자 이름 또는 코드']),\n        status: getPlain(page.properties['발송 상태']),\n        approval: getPlain(page.properties['승인 상태']),\n        sendType: getPlain(page.properties['발송 방식']),\n        retry: Number(getPlain(page.properties['재시도 횟수']) || 0),\n        body: getPlain(page.properties['메시지 본문']),\n        scheduledAt: getPlain(page.properties['예약 시각']),\n        kakaoId: getPlain(page.properties['카카오채널 수신 식별자']),\n        messageType: getPlain(page.properties['메시지 유형']),\n        link: getPlain(page.properties['첨부 링크 또는 리포트 링크'])\n      }));\n\n      if (parsedSurveys.length) setSurveys(parsedSurveys);\n      if (parsedSessions.length) setSessions(parsedSessions);\n      if (parsedKb.length) setKnowledge(parsedKb);\n      if (parsedQueue.length) setQueue(parsedQueue);\n      if (parsedEnv.KAKAO_CHANNEL_API_BASE_URL) addLog('Notion DB 로드 완료');\n    } catch (err) {\n      console.warn('[MVP] Notion API 실패, mock fallback 유지:', err.message);\n      addLog(`Notion API 실패 → mock fallback 유지: ${err.message}`);\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  function findCdssReferences(session) {\n    const keywords = `${session.symptoms} ${session.stage}`;\n    const refs = knowledge.filter((item) => keywords.includes(item.type) || keywords.includes('통증') || item.summary.includes('요통')).slice(0, 5);\n    return refs.length ? refs : [{ id: 'none', title: '참조 자료 없음', type: '검토필요', summary: '한의사 직접 검토 필요', caution: 'CDSS 자동 의견 생성 제한' }];\n  }\n\n  async function processQueueItem(item) {\n    const maxRetry = Number(env.MAX_RETRY_COUNT || MAX_RETRY_DEFAULT);\n    if (item.approval !== '승인완료') {\n      addLog(`${item.title}: 승인 전이라 스킵`);\n      return { ...item, status: '스킵' };\n    }\n    if (item.status === '예약됨' && item.scheduledAt) {\n      const scheduled = new Date(item.scheduledAt).getTime();\n      if (Number.isFinite(scheduled) && scheduled > Date.now()) {\n        addLog(`${item.title}: 예약 시간이 아직 도래하지 않음`);\n        return item;\n      }\n      if (Number.isFinite(scheduled) && Date.now() - scheduled > 300000) {\n        addLog(`${item.title}: 예약초과 표시`);\n        return { ...item, status: '예약초과' };\n      }\n    }\n    if (item.retry >= maxRetry) {\n      addLog(`${item.title}: 재시도 초과`);\n      return { ...item, status: '실패' };\n    }\n    try {\n      addLog(`${item.title}: 발송중`);\n      await sendKakaoMessage(item, env);\n      await createLog({ title: `${item.title} 성공`, target: item.recipient, source: item.source, result: '성공', retry: item.retry });\n      addLog(`${item.title}: 발송완료`);\n      return { ...item, status: '발송완료' };\n    } catch (err) {\n      console.warn('[Queue] 발송 실패:', err.message);\n      const nextRetry = item.retry + 1;\n      const nextStatus = nextRetry >= maxRetry ? '실패' : '재시도대기';\n      try {\n        await createLog({ title: `${item.title} 실패`, target: item.recipient, source: item.source, result: '실패', error: err.message, retry: nextRetry, followup: nextStatus === '실패' });\n      } catch (logErr) {\n        console.warn('[Queue] 로그 생성 실패:', logErr.message);\n      }\n      addLog(`${item.title}: ${nextStatus} (${err.message})`);\n      return { ...item, status: nextStatus, retry: nextRetry, lastError: err.message };\n    }\n  }\n\n  async function processQueueNow() {\n    const targets = queue.filter((item) => ['발송대기', '예약됨', '예약초과', '실패', '재시도대기'].includes(item.status));\n    const results = [];\n    for (const item of targets) {\n      results.push(await processQueueItem(item));\n    }\n    setQueue((prev) => prev.map((item) => results.find((result) => result.id === item.id) || item));\n  }\n\n  function startPolling() {\n    if (timerRef.current) return;\n    setPolling(true);\n    const seconds = Number(env.POLL_INTERVAL_SECONDS || POLL_INTERVAL_DEFAULT);\n    timerRef.current = window.setInterval(() => {\n      processQueueNow();\n    }, seconds * 1000);\n    addLog(`Polling 시작: ${seconds}초 주기`);\n  }\n\n  function stopPolling() {\n    if (timerRef.current) window.clearInterval(timerRef.current);\n    timerRef.current = null;\n    setPolling(false);\n    addLog('Polling 중지');\n  }\n\n  async function handleDownloadQrSvg() {\n    if (!formUrl) {\n      addLog('QR SVG 다운로드 실패: Form URL이 비어 있습니다.');\n      return;\n    }\n    try {\n      const assets = await generateQrAssets(formUrl);\n      downloadText('first-visit-qr.svg', assets.svg, 'image/svg+xml');\n      addLog('QR SVG 다운로드를 시작했습니다.');\n    } catch (err) {\n      console.warn('[QR] SVG 다운로드 실패:', err.message);\n      addLog(`QR SVG 다운로드 실패: ${err.message}`);\n    }\n  }\n\n  async function handleDownloadQrPng() {\n    if (!formUrl) {\n      addLog('QR PNG 다운로드 실패: Form URL이 비어 있습니다.');\n      return;\n    }\n    try {\n      const assets = await generateQrAssets(formUrl);\n      downloadDataUrl('first-visit-qr.png', assets.png);\n      addLog('QR PNG 다운로드를 시작했습니다.');\n    } catch (err) {\n      console.warn('[QR] PNG 다운로드 실패:', err.message);\n      addLog(`QR PNG 다운로드 실패: ${err.message}`);\n    }\n  }\n\n  function runHealthCheck() {\n    const checks = [\n      ['Notion API 연결', loading ? '확인중' : '점검 필요'],\n      ['초진설문 Form URL', formUrl ? '정상' : '누락'],\n      ['QR 생성 가능 여부', qrSvg ? '정상' : '오류'],\n      ['QR 다운로드 가능 여부', '정상'],\n      ['필수 DB ID const', Object.values(DB).every((id) => id.length === 32) ? '형식 정상' : '형식 오류'],\n      ['한의학 자료 DB', knowledge.length ? '정상' : '비어 있음'],\n      ['CRM 큐/로그 DB', queue.length ? '정상' : '비어 있음'],\n      ['.env 필수 Key', env.KAKAO_CHANNEL_API_BASE_URL ? '일부 확인' : 'mock 상태'],\n      ['Kakao token', env.KAKAO_CHANNEL_ACCESS_TOKEN && !env.KAKAO_CHANNEL_ACCESS_TOKEN.includes('REPLACE_WITH') ? '존재' : '누락 또는 비활성'],\n      ['브라우저 실행 상태', polling ? 'Polling 중' : '수동 처리 모드']\n    ];\n    addLog(`점검 실행: ${checks.map((item) => `${item[0]}=${item[1]}`).join(', ')}`);\n  }\n\n  useEffect(() => {\n    loadAll();\n    return () => {\n      if (timerRef.current) window.clearInterval(timerRef.current);\n    };\n  }, []);\n\n  return (\n    <main className=\"app\">\n      <section className=\"hero\">\n        <div className=\"card\">\n          <h1>한의원 AI 진료 자동화 MVP</h1>\n          <p className=\"muted\">초진설문 QR → 진료 세션 → 한의학 자료 기반 CDSS → AI 문서 검토 → CRM 카카오 발송 큐를 한 화면에서 점검합니다.</p>\n          <div className=\"alert\">내부 MVP 전용입니다. Kakao token을 브라우저에서 읽는 구조는 공개 배포나 외부 공유 링크에서 사용하지 마세요.</div>\n          <div className=\"toolbar\">\n            <button onClick={loadAll} disabled={loading}>{loading ? '불러오는 중...' : 'Notion 다시 불러오기'}</button>\n            <button onClick={processQueueNow}>지금 처리</button>\n            <button onClick={startPolling} disabled={polling}>Polling 시작</button>\n            <button className=\"secondary\" onClick={stopPolling} disabled={!polling}>Polling 중지</button>\n            <button className=\"secondary\" onClick={runHealthCheck}>점검 실행</button>\n          </div>\n        </div>\n        <div className=\"card\">\n          <div className=\"section-title\">\n            <strong>초진설문 QR</strong>\n            <span className=\"badge\">개인정보 미포함</span>\n          </div>\n          <div className=\"form-row\">\n            <label>초진설문 Form URL</label>\n            <input value={formUrl} onChange={handleChangeFormUrl} placeholder=\"초진설문지 폼 DB의 Form 공유 링크를 붙여넣으세요\" />\n            <p className=\"muted\">QR은 입력 즉시 생성되고, 값은 .env 설정 DB의 FIRST_VISIT_FORM_URL에 자동 저장됩니다. {savingFormUrl ? '저장 중...' : '저장 대기 없음'}</p>\n          </div>\n          <div className=\"qr-box\"><img src={qrDataUrl} alt=\"초진설문 QR\" /></div>\n          <div className=\"toolbar\">\n            <button className=\"secondary\" onClick={() => navigator.clipboard.writeText(formUrl)} disabled={!formUrl}>URL 복사</button>\n            <button className=\"secondary\" onClick={openSurveyDatabase} disabled={!SURVEY_DB_URL}>초진설문 DB 열기</button>\n            <button className=\"secondary\" onClick={handleDownloadQrSvg} disabled={!formUrl}>QR SVG 다운로드</button>\n            <button className=\"secondary\" onClick={handleDownloadQrPng} disabled={!formUrl}>QR PNG 다운로드</button>\n          </div>\n        </div>\n      </section>\n\n      <section className=\"grid cols-4\">\n        <div className=\"card metric\"><span>오늘 진료 세션</span><strong>{sessions.length}</strong></div>\n        <div className=\"card metric\"><span>초진설문 응답</span><strong>{surveys.length}</strong></div>\n        <div className=\"card metric\"><span>CRM 처리 대상</span><strong>{queueStats.active}</strong></div>\n        <div className=\"card metric\"><span>실패/재시도</span><strong>{queueStats.failed}</strong></div>\n      </section>\n\n      <section className=\"grid cols-3\" style={undefined}>\n        <div className=\"card\">\n          <div className=\"section-title\"><strong>초진설문 응답</strong><span className=\"badge gray\">필수값 점검</span></div>\n          <div className=\"table-wrap\">\n            <table>\n              <thead><tr><th>이름</th><th>주소증</th><th>상태</th><th>위험 신호</th></tr></thead>\n              <tbody>{surveys.map((item) => <tr key={item.id}><td>{item.name}</td><td>{item.symptom}</td><td>{item.status}</td><td>{item.redFlags}</td></tr>)}</tbody>\n            </table>\n          </div>\n        </div>\n        <div className=\"card\">\n          <div className=\"section-title\"><strong>진료 세션</strong><span className=\"badge green\">CDSS 연결</span></div>\n          <div className=\"table-wrap\">\n            <table>\n              <thead><tr><th>세션</th><th>상태</th><th>증상</th><th>승인</th></tr></thead>\n              <tbody>{sessions.map((item) => <tr key={item.id}><td>{item.title}</td><td>{item.stage}</td><td>{item.symptoms}</td><td>{item.approval}</td></tr>)}</tbody>\n            </table>\n          </div>\n        </div>\n        <div className=\"card\">\n          <div className=\"section-title\"><strong>CDSS 참조</strong><span className=\"badge orange\">3~5개 우선</span></div>\n          {sessions.slice(0, 1).map((session) => (\n            <div key={session.id} className=\"check-list\">\n              {findCdssReferences(session).map((item) => (\n                <div className=\"check-item\" key={item.id}>\n                  <span><strong>{item.title}</strong><br /><span className=\"muted\">{item.summary}</span></span>\n                  <span className=\"badge\">{item.type}</span>\n                </div>\n              ))}\n            </div>\n          ))}\n        </div>\n      </section>\n\n      <section className=\"grid cols-3\">\n        <div className=\"card\" style={undefined}>\n          <div className=\"section-title\"><strong>CRM 카카오 발송 큐</strong><span className=\"badge red\">브라우저 worker</span></div>\n          <div className=\"table-wrap\">\n            <table>\n              <thead><tr><th>요청</th><th>수신자</th><th>상태</th><th>방식</th><th>재시도</th></tr></thead>\n              <tbody>{queue.map((item) => <tr key={item.id}><td>{item.title}</td><td>{item.recipient}</td><td>{item.status}</td><td>{item.sendType}</td><td>{item.retry}</td></tr>)}</tbody>\n            </table>\n          </div>\n        </div>\n        <div className=\"card\">\n          <div className=\"section-title\"><strong>점검 패널</strong><span className=\"badge gray\">수동 확인</span></div>\n          <div className=\"check-list\">\n            <div className=\"check-item\"><span>Form URL</span><strong>{formUrl ? '정상' : '누락'}</strong></div>\n            <div className=\"check-item\"><span>QR 생성</span><strong>{qrSvg ? '정상' : '오류'}</strong></div>\n            <div className=\"check-item\"><span>Kakao token</span><strong>{env.KAKAO_CHANNEL_ACCESS_TOKEN ? '확인 필요' : 'mock'}</strong></div>\n            <div className=\"check-item\"><span>Polling</span><strong>{polling ? '실행중' : '중지'}</strong></div>\n          </div>\n        </div>\n        <div className=\"card\">\n          <div className=\"section-title\"><strong>실행 로그</strong><span className=\"badge gray\">{logs.length}</span></div>\n          <div className=\"log\">{logs.map((item) => <div key={item}>{item}</div>)}</div>\n        </div>\n      </section>\n    </main>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);";
